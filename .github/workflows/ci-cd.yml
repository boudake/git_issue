
name: Ecommerce Spark CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test Python project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -v

  build:
    name: Build and publish Docker image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy-dev:
    name: Deploy to development
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, X64]
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Kind access
        shell: bash
        run: |
          kubectl --context kind-spark get nodes
          kubectl --context kind-spark get services -A

      - name: Submit Spark job to dev
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          sed \
            -e "s|__IMAGE__|${IMAGE}|g" \
            -e "s|__JOB_SUFFIX__|${SHORT_SHA}|g" \
            k8s/ecommerce-job.yaml |
            kubectl --context kind-spark apply -n ecommerce -f -

      - name: Wait for Spark job
        shell: bash
        run: |
          JOB="ecommerce-analytics-${GITHUB_SHA:0:7}"

          if ! kubectl --context kind-spark wait \
            -n ecommerce \
            --for=condition=complete \
            "job/${JOB}" \
            --timeout=30m; then
            kubectl --context kind-spark describe job "$JOB" -n ecommerce || true
            kubectl --context kind-spark logs "job/${JOB}" -n ecommerce || true
            exit 1
          fi

          kubectl --context kind-spark logs "job/${JOB}" -n ecommerce