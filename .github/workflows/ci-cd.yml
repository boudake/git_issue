name: Ecommerce Spark CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -v

  build:
    name: Build and push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        env:
          NAME: ${{ env.IMAGE_NAME }}
        run: echo "name=${NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest        # use self-hosted if the cluster is local
    environment: dev
    env:
      NS: ecommerce
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DEV }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl get ns "$NS"

      - name: Submit job
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          kubectl delete job -n "$NS" "ecommerce-analytics-${SHORT_SHA}" --ignore-not-found
          sed "s|__IMAGE__|${IMAGE}|g; s|__JOB_SUFFIX__|${SHORT_SHA}|g" \
            k8s/ecommerce-job.yaml | kubectl apply -n "$NS" -f -

      - name: Wait for job
        run: |
          JOB="ecommerce-analytics-${GITHUB_SHA:0:7}"
          for i in $(seq 1 180); do
            s=$(kubectl get job -n "$NS" "$JOB" -o jsonpath='{.status.succeeded}')
            f=$(kubectl get job -n "$NS" "$JOB" -o jsonpath='{.status.failed}')
            [ "${s:-0}" -ge 1 ] && echo "Job succeeded" && exit 0
            [ "${f:-0}" -ge 1 ] && echo "Job failed" && exit 1
            sleep 10
          done
          echo "Timeout"; exit 1

      - name: Logs on failure
        if: failure()
        run: kubectl logs -n "$NS" "job/ecommerce-analytics-${GITHUB_SHA:0:7}" --tail=200 || true

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"